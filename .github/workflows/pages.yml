# Publica web/ en GitHub Pages (Ajustes → Pages → Origen: GitHub Actions). Web Serial exige https.
name: Pages
on:
  push:
    branches: [main, claude/pokemon-frlg-save-dump-mvp-y3f6ow]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # GitHub solo permite publicar Pages desde la rama por defecto; en las demás no se hace nada.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
